# Combos whose members are morse keys, resolved in the default Normal mode.
#
# One of four `morse_combo_*` files — see `morse_combo_permissive_hold.toml`
# for the shared fixture and timeline names. No mode flags are set, so the
# defaults apply: Normal mode, 250 ms hold/gap timeouts.

keyboard = "boards/split.toml"

[behavior.combo]
timeout = "50ms"
combos = [
  { actions = ["MT(B, LShift)", "MT(C, LGui)"], output = "X" },
  { actions = ["A", "MT(B, LShift)"], output = "Y" },
  { actions = ["MT(B, LShift)", "MT(C, LGui)", "LT(1, D)"], output = "Z" },
]

[[test]]
name = "two_key_in_window"
steps = [
  { delay = 20 },
  { press = [1, 1] },    # Press MT(B, LShift)
  { delay = 20 },
  { tap = { pos = [1, 7], duration = 10 } },
  { delay = 300 },
  { release = [1, 1] },  # Release B
]
expect = [["X"], []]

[[test]]
name = "two_key_misses_window"
steps = [
  { delay = 20 },
  { press = [1, 1] },    # Press MT(B, LShift)
  { delay = 60 },
  { tap = { pos = [1, 7], duration = 10 } },
  { delay = 300 },
  { release = [1, 1] },  # Release B — Normal mode resolves it only on release
]
expect = [["C"], [], ["LShift"], []]

# A combo key still waiting for its partner when a mod-tap's hold fires keeps
# waiting: the partner completes the combo, and no member is left held.
[[test]]
name = "a_hold_leaves_a_waiting_combo_key_waiting"
behavior.combo = { timeout = "50ms", combos = [{ actions = ["W", "E"], output = "X" }] }
steps = [
  { press = [1, 1] },    # Press MT(B, LShift)
  { delay = 220 },
  { press = [1, 3] },    # Press W, waiting for E
  { delay = 40 },        # MT's hold fires at 250 ms
  { press = [1, 4] },    # Press E: the combo
  { release = [1, 3] },
  { release = [1, 4] },
  { release = [1, 1] },
]
expect = [["LShift"], ["LShift", "X"], ["LShift"], []]
